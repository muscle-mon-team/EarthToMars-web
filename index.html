<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>EarthToMars</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<!-- 웹 내보내기의 html/head_include. .github/workflows/web-deploy.yml이 읽어서 Web 설정에 넣는다. -->
<style>
/* 페이지가 넘치거나 확대되지 않게 고정한다. 아이폰 Safari는 회전 중 캔버스가 화면보다 크면 페이지를 확대해 비율이 틀어진다. */
html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
}
#canvas {
	position: fixed;
	top: 0;
	left: 0;
}
/* 게임은 가로 화면(기획서). 웹은 방향을 고정할 수 없으므로 터치 기기를 세로로 들면 안내 화면으로 가린다. */
#rotate-hint {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 1000;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 20px;
	background: #140f2b;
	color: #ffd27a;
	font: 700 22px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
	text-align: center;
}
#rotate-hint .rotate-icon {
	width: 56px;
	height: 92px;
	border: 5px solid #ffd27a;
	border-radius: 12px;
	animation: rotate-hint-turn 1.8s ease-in-out infinite;
}
@keyframes rotate-hint-turn {
	0%, 25% { transform: rotate(0deg); }
	60%, 100% { transform: rotate(-90deg); }
}
@media (orientation: portrait) and (hover: none) and (pointer: coarse) {
	#rotate-hint { display: flex; }
}
/* 사진 등록의 세로 화면(카메라·위치 조정)을 쓰는 동안은 게임이 세로를 허용하므로 안내를 숨긴다(screen_orientation.gd가 알림) */
html.portrait-ok #rotate-hint { display: none; }
</style>
<script>
// 새 버전 확인: 이 페이지의 버전(current. 배포 때 커밋 번호로 바뀜)과 build.txt의 최신 버전이 다르면
// 캐시된 예전 페이지이므로 ?v=최신버전 주소로 다시 연다(다른 주소라 캐시를 쓰지 않음). 같은 버전 주소면 다시 열지 않아 반복되지 않는다.
(function () {
	var current = "164d2c3";
	if (current.indexOf("__") === 0) {
		return;  // 배포가 아닌 로컬 내보내기
	}
	try {
		var req = new XMLHttpRequest();
		req.open("GET", "build.txt?t=" + Date.now(), false);
		req.send();
		var latest = req.status === 200 ? req.responseText.trim() : "";
		var url = new URL(location.href);
		if (latest && latest !== current && url.searchParams.get("v") !== latest) {
			url.searchParams.set("v", latest);
			location.replace(url.toString());
		}
	} catch (e) {
		console.warn("최신 버전 확인 실패, 현재 페이지로 실행합니다:", e);
	}
})();
document.addEventListener("DOMContentLoaded", function () {
	var hint = document.createElement("div");
	hint.id = "rotate-hint";
	hint.innerHTML = '<div class="rotate-icon"></div><div>화면을 가로로 돌려 주세요</div>';
	document.body.appendChild(hint);
});
// 게임(GDScript)이 JavaScriptBridge.get_interface("EarthToMarsWeb")로 부르는 웹 전용 기능.
window.EarthToMarsWeb = {
	// 세로 화면 허용 여부(true면 "가로로 돌려 주세요" 안내를 숨긴다).
	setPortraitAllowed: function (on) {
		document.documentElement.classList.toggle("portrait-ok", !!on);
	},
	// 사진 고르기. useCamera면 전면 카메라 앱, 아니면 사진 선택 창.
	// 고른 사진은 방향(EXIF)을 바로잡고 긴 변 MAX_EDGE로 줄인 JPEG의 base64로 callback에 준다. 읽지 못하면 "". 취소하면 부르지 않는다.
	pickImage: function (useCamera, callback) {
		var MAX_EDGE = 1600;
		var input = document.createElement("input");
		input.type = "file";
		input.accept = "image/*";
		if (useCamera) {
			input.setAttribute("capture", "user");
		}
		input.style.display = "none";
		document.body.appendChild(input);
		input.addEventListener("cancel", function () { input.remove(); });
		input.addEventListener("change", function () {
			var file = input.files && input.files[0];
			input.remove();
			if (!file) {
				return;
			}
			var url = URL.createObjectURL(file);
			var img = new Image();
			img.onload = function () {
				var k = Math.min(1, MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
				var canvas = document.createElement("canvas");
				canvas.width = Math.round(img.naturalWidth * k);
				canvas.height = Math.round(img.naturalHeight * k);
				canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
				URL.revokeObjectURL(url);
				callback(canvas.toDataURL("image/jpeg", 0.92).split(",")[1] || "");
			};
			img.onerror = function () {
				URL.revokeObjectURL(url);
				callback("");
			};
			img.src = url;
		});
		input.click();
	}
};
// 회전 뒤 Safari가 남긴 스크롤 위치를 되돌린다.
window.addEventListener("resize", function () {
	setTimeout(function () { window.scrollTo(0, 0); }, 100);
});
</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"mainPack":"index.164d2c3.pck","fileSizes":{"index.164d2c3.pck":1830880,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
